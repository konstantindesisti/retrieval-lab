redis:
  url: "redis://localhost:6379"
  embedding_cache_ttl: 604800  # 7 days in seconds

# === Embedding ===
embedding_option:
  provider: "fastembed"  # Promeni ovo u "ollama" ili "cohere" da bi ih aktivirao

embedding_providers:
  fastembed:
    model_name: "BAAI/bge-small-en-v1.5"
    dimension: 384

  ollama:
    model_name: "nomic-embed-text"
    dimension: 768
    host: "http://localhost:11434"  # Opciono, specifično za ollama

  cohere:
    model_name: "embed-multilingual-v3.0"
    dimension: 1024
    # api_key se može uzeti iz .env fajla, ne mora biti ovde

# === Chunking ===
chunker:
  strategy: "fixed"
  size: 512
  overlap: 54

# === Temporal ===
temporal:
  host: "localhost:7233"
  namespace: "default"
  task_queue: "ingestion-queue"